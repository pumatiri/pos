<script>
(function () {

/* ============================== API ============================== */

/* ============================== TOAST & MODAL ============================== */

const ICT = { info: 'info', success: 'check', warn: 'alert', danger: 'alert' };
const Dlg = {

/* ============================== FORM BUILDER ============================== */
function normOpts(f) { return (f.options || f.opts || []).map(o => typeof o === 'object' ? o : { v: o, l: o }); }

}
function bindForm(box) {
  $$('input[type=checkbox]', box).forEach(cb => { const t = cb.closest('.switch'); if (t) cb.addEventListener('change', () => { $('.sw-t', t).textContent = cb.checked ? 'Ya' : 'Tidak'; }); });
  $$('[data-eye]', box).forEach(b => b.addEventListener('click', () => { const i = b.previousElementSibling; const show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.innerHTML = ic(show ? 'eyeoff' : 'eye'); }));
}
function readForm(box, fields) {
  const values = {}; let ok = true, first = null;
  fields.forEach(f => {
    const el = $('[name="' + f.n + '"]', box); if (!el) return;
    const wrap = el.closest('.fld'); let v;
    if (f.t === 'switch') v = el.checked ? 'Ya' : 'Tidak';
    else if (f.t === 'num') v = el.value === '' ? '' : Number(el.value);

/* ============================== TABEL ============================== */
function toCSV(cols, rows) {
  const q = v => { v = v == null ? '' : String(v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return [cols.map(c => q(c.l)).join(',')].concat(rows.map(r => cols.map(c => q(c.v ? c.v(r) : r[c.k])).join(','))).join('\r\n');
}
function downloadCSV(name, text) {

    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' }));
    a.download = name + '_' + todayStr() + '.csv'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('Berkas CSV diunduh', 'success');
  } catch (e) {
    modal('<div class="dlg-h"><h3>Salin data CSV</h3><button class="icon-btn sm" data-close="0">' + ic('x') + '</button></div><div class="dlg-body"><textarea class="inp" rows="12" readonly>' + esc(text) + '</textarea></div><div class="dlg-f"><button class="btn btn-pri" data-close="1">Selesai</button></div>', { cls: 'md' });
  }
}
function makeTable(host, cfg) {
  const st = { q: '', sort: cfg.sort || null, dir: cfg.dir || 1, page: 1, rows: cfg.rows || [], size: cfg.pageSize || 12 };
  host.innerHTML = '<div class="tb-bar"><div class="search">' + ic('search') + '<input class="tb-q" placeholder="' + esc(cfg.ph || 'Cari data...') + '" aria-label="Cari"></div><div class="tb-sp"></div>' + (cfg.toolbar || '') + (cfg.csv ? '<button class="btn btn-ghost btn-sm" data-tb="csv">' + ic('download') + 'CSV</button>' : '') + '</div><div class="tb-wrap"></div><div class="tb-foot"></div>';
  const wrap = $('.tb-wrap', host), foot = $('.tb-foot', host);
  const keyOf = r => r[cfg.key || 'id'];
  function filtered() {

    if (st.sort) { const c = cfg.cols.find(x => x.k === st.sort); const g = c && c.v ? c.v : (x => x[st.sort]); r = r.slice().sort((a, b) => { const A = g(a), B = g(b); return (typeof A === 'number' && typeof B === 'number' ? A - B : String(A).localeCompare(String(B), 'id', { numeric: true })) * st.dir; }); }
    return r;

    if (!rows.length) { wrap.innerHTML = '<div class="empty">' + ic('search') + '<b>' + esc(cfg.empty || 'Belum ada data') + '</b><span>' + (st.q ? 'Coba kata kunci lain.' : 'Data akan tampil di sini.') + '</span></div>'; }

        rows.map(r => '<tr data-id="' + esc(keyOf(r)) + '"' + (cfg.onRow ? ' class="clk"' : '') + '>' + cfg.cols.map(c => '<td class="' + (c.num ? 'num' : '') + ' ' + (c.cls || '') + '">' + (c.r ? c.r(r) : esc(r[c.k])) + '</td>').join('') + (cfg.actions ? '<td class="act">' + cfg.actions(r) + '</td>' : '') + '</tr>').join('') + '</tbody></table>';

  }

  host.addEventListener('click', e => {
    const th = e.target.closest('th.sortable'); if (th) { const k = th.dataset.k; if (st.sort === k) st.dir = -st.dir; else { st.sort = k; st.dir = 1; } view(); return; }
    const pb = e.target.closest('[data-p]'); if (pb && !pb.disabled) { st.page = +pb.dataset.p; view(); return; }
    if (e.target.closest('[data-tb=csv]')) { const cols = cfg.cols.filter(c => c.csv !== false); downloadCSV(cfg.csvName || 'data', toCSV(cols, filtered())); return; }
    const ra = e.target.closest('[data-ra]'); if (ra) { e.stopPropagation(); const tr = ra.closest('tr'); const row = st.rows.find(r => String(keyOf(r)) === tr.dataset.id); if (row && cfg.onAction) cfg.onAction(ra.dataset.ra, row, ra); return; }
    const tr = e.target.closest('tbody tr'); if (tr && cfg.onRow) { const row = st.rows.find(r => String(keyOf(r)) === tr.dataset.id); if (row) cfg.onRow(row); }

}

/* ============================== GRAFIK ============================== */
function niceMax(m) { const p = Math.pow(10, Math.floor(Math.log10(m))), s = p / 2; return Math.ceil(m / s) * s; }
function areaChart(data) {
  const W = 640, H = 220, L = 46, R = 14, T = 14, B = 30, iw = W - L - R, ih = H - T - B;
  const top = niceMax(Math.max(1, Math.max.apply(null, data.map(d => d.v))));
  const x = i => L + (data.length > 1 ? i * iw / (data.length - 1) : iw / 2), y = v => T + ih - (v / top) * ih;
  let g = ''; for (let k = 0; k <= 4; k++) { const yy = y(top * k / 4); g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--border)" stroke-dasharray="3 5"/><text x="' + (L - 8) + '" y="' + (yy + 4) + '" text-anchor="end">' + short(top * k / 4) + '</text>'; }
  const pts = data.map((d, i) => [x(i), y(d.v)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ' L' + x(data.length - 1) + ' ' + (T + ih) + ' L' + x(0) + ' ' + (T + ih) + ' Z';
  const labels = data.map((d, i) => '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(d.l) + '</text>').join('');
  const dots = pts.map((p, i) => '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4.5" fill="var(--surface)" stroke="var(--pri2)" stroke-width="2.5"><title>' + esc(data[i].l) + ': ' + rp(data[i].v) + '</title></circle>').join('');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Grafik penjualan"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--pri2)" stop-opacity=".38"/><stop offset="1" stop-color="var(--pri2)" stop-opacity="0"/></linearGradient></defs>' + g + '<path d="' + area + '" fill="url(#ag)"/><path d="' + line + '" fill="none" stroke="var(--pri2)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>' + dots + labels + '</svg>';
}
function donut(parts, center) {
  const tot = parts.reduce((a, p) => a + p.v, 0);
  let cum = 0, cs = '';
  parts.forEach(p => { if (p.v <= 0) return; const pct = p.v / tot * 100; cs += '<circle cx="21" cy="21" r="15.9155" stroke="' + p.c + '" stroke-dasharray="' + pct.toFixed(2) + ' ' + (100 - pct).toFixed(2) + '" stroke-dashoffset="' + (25 - cum).toFixed(2) + '"><title>' + esc(p.l) + ': ' + rp(p.v) + '</title></circle>'; cum += pct; });
  if (!tot) cs = '<circle cx="21" cy="21" r="15.9155" stroke="var(--border)" stroke-dasharray="100 0"/>';
  return '<div class="donut-w"><svg class="donut" viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9155" stroke="var(--bg2)" stroke-dasharray="100 0" style="animation:none"/>' + cs + '<text x="21" y="22" text-anchor="middle" font-size="5">' + esc(center || '') + '</text></svg><div class="legend">' + parts.map(p => '<div><i style="background:' + p.c + '"></i>' + esc(p.l) + ' <b>' + rp(p.v) + '</b></div>').join('') + '</div></div>';
}
function countUp(root, instant) {

    const end = Number(el.dataset.count) || 0, rpf = el.dataset.fmt === 'rp', t0 = performance.now(), dur = instant ? 1 : 800;

  },

  toggle() { this.on = !this.on; store.set('pos_live', this.on ? '1' : '0'); this.paint(); toast(this.on ? 'Auto refresh setiap 15 detik aktif' : 'Auto refresh dijeda', 'info', 2200); if (this.on) this.tick(); },

async function getCats() { if (!S.cache.cats) S.cache.cats = (await api('crudList', { entity: 'categories' })).rows.map(r => r.nama).sort(); return S.cache.cats; }
async function getProds(bg) { if (!S.cache.prods) S.cache.prods = (await api('crudList', { entity: 'products' }, bg ? { bg: true, silent: true } : undefined)).rows; return S.cache.prods; }
async function decorate(E, key) {
  const cats = E.fields.some(f => f.from === 'categories') || key === 'promos' ? await getCats() : [], prods = key === 'promos' ? await getProds() : [];
  return E.fields.map(f => {
    const o = Object.assign({}, f);
    if (f.from === 'categories') o.options = cats;
    if (f.n === 'role') { o.options = ['kasir', 'admin', 'superadmin'].filter(r => S.user.role === 'superadmin' || r !== 'superadmin').map(r => ({ v: r, l: ROLE_L[r] })); }
    if (f.dyn) o.options = [];
    return o;
  });
}

function cellFor(key, f, k) {
  const fld = f || {};

    if (k === 'role') return badge(ROLE_L[v] || v, v === 'kasir' ? '' : 'pri');
    if (k === 'online') return r.role === 'superadmin' ? badge('Multi-perangkat', 'info') : (v ? badge('Online', 'ok') : badge('Offline', ''));
    if (k === 'createdAt' || k === 'lastLogin') return fmtDT(v);
    if (fld.t === 'date') return fmtD(v);
    if (fld.rp || k === 'totalBelanja') return rp(v);
    if (k === 'kode') return '<b class="mono">' + esc(v) + '</b>';
    if (key === 'products' && k === 'stok') return badge(nf(v) + ' ' + esc(r.satuan), v <= 0 ? 'err' : v <= r.stokMin ? 'warn' : 'ok');
    if (k === 'nilai') return r.jenis === 'PERSEN' ? nf(v) + '%' : rp(v);
    if (k === 'targetId') return r.target === 'PRODUK' ? esc(((S.cache.prods || []).find(p => p.id === v) || {}).nama || v) : esc(v);
    if (k === 'username') return '<b>@' + esc(v) + '</b>';

/* ---- impor produk CSV ---- */
function parseCSV(text) {
  text = text.replace(/^﻿/, ''); const first = text.split(/\r?\n/)[0] || '', delim = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; } else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}
function importDlg(reload) {
  const m = modal('<div class="dlg-h"><h3>Impor Produk dari CSV</h3><button class="icon-btn sm" data-close="0">' + ic('x') + '</button></div><div class="dlg-body" style="display:grid;gap:14px"><div class="alert-box info">' + ic('info') + '<span>Kolom yang dikenali: <b>sku, barcode, nama, kategori, satuan, hargaBeli, hargaJual, stok</b>. Produk dengan SKU/barcode yang sudah ada akan diperbarui (stok tidak diubah). Kategori baru dibuat otomatis.</span></div><div class="drop">' + ic('upload', 'xl') + '<b>Pilih berkas CSV</b><input type="file" id="impF" accept=".csv,text/csv"><button class="btn btn-ghost btn-sm" id="impT">' + ic('download') + 'Unduh Template</button></div><div id="impP"></div></div><div class="dlg-f"><button class="btn btn-ghost" data-close="0">Batal</button><button class="btn btn-pri" id="impGo" disabled>Impor Sekarang</button></div>', { cls: 'md' });
  let data = [];
  $('#impT', m.box).onclick = () => downloadCSV('template_produk', 'sku,barcode,nama,kategori,satuan,hargaBeli,hargaJual,stok\r\nSKU001,8999999000011,Beras Premium 5kg,Sembako,pcs,60000,68000,20\r\nSKU002,,Minyak Goreng 1L,Sembako,pcs,15000,17500,36');
  $('#impF', m.box).addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = () => {
      const t = parseCSV(String(rd.result)); if (t.length < 2) { toast('Berkas kosong atau tidak valid', 'error'); return; }
      const hd = t[0].map(h => h.trim());
      data = t.slice(1).map(r => { const o = {}; hd.forEach((h, i) => { o[h] = (r[i] || '').trim(); }); return o; });
      $('#impP', m.box).innerHTML = '<div class="alert-box ok">' + ic('check') + '<span><b>' + data.length + '</b> baris siap diimpor. Kolom: ' + esc(hd.join(', ')) + '</span></div>'; $('#impGo', m.box).disabled = false;
    };
    rd.readAsText(f);
  });
  $('#impGo', m.box).onclick = async e => {
    const b = e.currentTarget; b.classList.add('loading'); b.disabled = true;
    try { const r = await api('importProducts', { rows: data }); m.close(true); S.cache = {}; await Dlg.alert('Impor Selesai', r.created + ' produk baru, ' + r.updated + ' diperbarui, ' + r.failed + ' gagal.' + (r.errors.length ? '\n\n' + r.errors.join('\n') : ''), r.failed ? 'warn' : 'success'); reload(); }
    catch (er) { b.classList.remove('loading'); b.disabled = false; }
  };
}

/* ============================== SCANNER KAMERA ============================== */
const Scan = {
  zx: null,
  loadZX() {
    if (window.ZXing) return Promise.resolve();
    if (Scan.zx) return Scan.zx;
    Scan.zx = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'; s.onload = res; s.onerror = () => { Scan.zx = null; rej(new Error('Pustaka pemindai gagal dimuat (cek koneksi internet).')); }; document.head.appendChild(s); });
    return Scan.zx;
  },
  async decodeImage(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Gambar tidak dapat dibaca')); i.src = url; });
      if ('BarcodeDetector' in window) { try { const r = await new window.BarcodeDetector().detect(img); if (r && r[0]) return r[0].rawValue; } catch (e) { /* lanjut ZXing */ } }
      await Scan.loadZX();
      const rd = new ZXing.BrowserMultiFormatReader();
      try { return (await rd.decodeFromImageElement(img)).getText(); } finally { try { rd.reset(); } catch (e) { /* abaikan */ } }
    } finally { URL.revokeObjectURL(url); }
  },
  beep() {
    try { const C = window.AudioContext || window.webkitAudioContext, c = new C(), o = c.createOscillator(), g = c.createGain(); o.frequency.value = 1100; g.gain.value = .08; o.connect(g); g.connect(c.destination); o.start(); setTimeout(() => { o.stop(); c.close(); }, 120); } catch (e) { /* abaikan */ }
    try { navigator.vibrate && navigator.vibrate(60); } catch (e) { /* abaikan */ }
  }
};
/* opsi: { onCode(kode) -> boleh async, continuous } ; mengembalikan kode terakhir */
function openScanner(o) {
  o = o || {};
  const m = modal('<div class="dlg-h"><h3>Scan Barcode</h3><button class="icon-btn sm" data-close="0" aria-label="Tutup">' + ic('x') + '</button></div><div class="dlg-body"><div class="scan-view" id="scV"><video id="scVid" playsinline muted></video><div class="scan-line"></div></div><p class="muted" id="scMsg" style="text-align:center;margin:10px 0 4px;font-size:13px">Menyalakan kamera…</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0"><label class="btn btn-ghost">' + ic('camera') + 'Ambil Foto Barcode<input type="file" id="scFile" accept="image/*" capture="environment" style="display:none"></label></div></div>', { cls: 'md', dismiss: false });
  let stream = null, stopped = false, lastCode = '', lastAt = 0, result = null, reader = null;
  const msg = t => { const e = $('#scMsg', m.box); if (e) e.textContent = t; };
  const stop = () => { stopped = true; try { stream && stream.getTracks().forEach(t => t.stop()); } catch (e) { /* abaikan */ } try { reader && reader.reset(); } catch (e) { /* abaikan */ } };
  m.promise.then(stop);
  async function got(code) {
    code = String(code || '').trim(); if (!code) return;
    const nowT = Date.now(); if (code === lastCode && nowT - lastAt < 2500) return; lastCode = code; lastAt = nowT;
    Scan.beep(); result = code;
    if (o.onCode) { try { await o.onCode(code); } catch (e) { /* abaikan */ } }
    if (o.continuous) msg('Terbaca: ' + code + ' — arahkan ke barcode berikutnya'); else m.close(code);
  }
  $('#scFile', m.box).addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return; msg('Membaca foto…');
    try { await got(await Scan.decodeImage(f)); } catch (er) { msg('Barcode tidak terbaca. Coba foto lebih dekat, terang, dan tajam.'); }
    e.target.value = '';
  });
  (async () => {
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no-cam');
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      if (stopped) { stop(); return; }
      const v = $('#scVid', m.box); v.srcObject = stream; await v.play(); msg('Arahkan kamera ke barcode');
      if ('BarcodeDetector' in window) {
        const det = new window.BarcodeDetector();
        const loop = async () => { if (stopped) return; try { const r = await det.detect(v); if (r && r[0]) await got(r[0].rawValue); } catch (e) { /* abaikan */ } setTimeout(loop, 180); };
        loop();
      } else {
        await Scan.loadZX(); if (stopped) return;
        reader = new ZXing.BrowserMultiFormatReader();
        reader.decodeFromVideoElement(v, (res) => { if (res) got(res.getText()); });
      }
    } catch (e) {
      $('#scV', m.box).classList.add('off');
      msg(e && e.message === 'no-cam' || !e || /Permission|NotAllowed|denied/i.test(e.name + e.message) ? 'Kamera langsung tidak tersedia/diblokir browser. Gunakan tombol "Ambil Foto Barcode" di bawah.' : (e.message || 'Kamera tidak dapat dibuka.') + ' Gunakan tombol foto di bawah.');
    }
  })();
  return m.promise.then(v => (typeof v === 'string' ? v : result));
}

function resizeImage(file, max) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let u = c.toDataURL('image/png'); if (u.length > 1.9e6) u = c.toDataURL('image/jpeg', .88); resolve(u);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Gambar tidak dapat dibaca')); }; img.src = url;
  });
}

        try { const u = await resizeImage(f, kind === 'logo' ? 512 : 900); const r = await api('uploadAsset', { kind: kind, dataUrl: u }); S.assets = r; S.settings.hasLogo = !!r.logo; S.settings.hasQris = !!r.qris; paintDrop(kind); paintBrand(); toast((kind === 'logo' ? 'Logo' : 'QRIS') + ' berhasil diunggah', 'success'); } catch (er) { if (er && !er.code) toast(er.message, 'error'); }
      });
      const rm = $('[data-rm]', h); if (rm) rm.onclick = async () => { if (!(await Dlg.confirm({ type: 'danger', title: 'Hapus ' + (kind === 'logo' ? 'logo' : 'kode QRIS') + '?', msg: 'Berkas akan dihapus dari sistem.', ok: 'Ya, Hapus' }))) return; S.assets = await api('removeAsset', { kind: kind }); paintDrop(kind); paintBrand(); toast('Berkas dihapus', 'success'); };
    }
    paintDrop('logo'); paintDrop('qris');
    $('#sv', el).onclick = async e => {
      const r = readForm($('#sf', el), fields); if (!r) return; const b = e.currentTarget; b.classList.add('loading'); b.disabled = true;
      try { S.settings = await api('settingsSave', { settings: r.values }); paintBrand(); toast('Pengaturan berhasil disimpan', 'success'); } catch (er) { /* toast otomatis */ }
      b.classList.remove('loading'); b.disabled = false;
    };
  }
};

      '<div class="card" style="margin-top:16px"><div class="card-h"><h3>Salinan Backup Terbaru</h3></div><div class="card-b">' + (d.backups.length ? '<div class="list">' + d.backups.map(b => '<div class="list-i"><div class="grow"><b>' + esc(b.name) + '</b><small class="muted">' + fmtDT(b.t) + '</small></div>' + badge('Drive', 'info') + '</div>').join('') + '</div>' : '<div class="empty">' + ic('database') + 'Belum ada salinan backup</div>') + '</div></div>';

/* ============================== BOOT ============================== */
async function boot() {
  const th = store.get('pos_theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); setTheme(th);
  let info = { toko: 'Toko POS', logo: '', setup: false };
  try { info = await api('bootstrap', {}, { silent: true }); } catch (e) { $('#boot').classList.add('gone'); $('#root').innerHTML = '<div class="auth" style="grid-template-columns:1fr"><div class="auth-form"><div class="auth-card center"><div class="dlg-ic danger">' + ic('alert', 'lg') + '</div><h1>Tidak dapat terhubung</h1><p class="sub">Periksa koneksi internet Anda, lalu muat ulang.</p><button class="btn btn-pri btn-block" onclick="location.reload()">Muat Ulang</button></div></div></div>'; return; }
  const tk = sess.get('pos_tk');
  if (tk && !info.setup) { try { S.token = tk; await enter({ token: tk }); return; } catch (e) { S.token = null; sess.del('pos_tk'); if (loggingOut) return; } }
  if (info.setup) showSetup(info); else showLogin(info);
}
window.addEventListener('unhandledrejection', e => { e.preventDefault(); });
boot();
})();
</script>
